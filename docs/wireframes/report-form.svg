<svg xmlns="http://www.w3.org/2000/svg" width="860" height="910" viewBox="0 0 860 910"><rect width="860" height="910" fill="#ffffff"/><text x="40" y="50" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="start" font-weight="bold">Report a tick sighting</text><text x="40" y="76" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start">Found a tick? Add it to the map so others nearby know to check.</text><rect x="40" y="96" width="560" height="70" rx="4" fill="#fbe9ef" stroke="#b0306a"/><text x="56" y="120" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Check these before sending</text><text x="56" y="144" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="start">- Nearest city: Choose the nearest city (links to the field)</text><text x="40" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Date you saw it</text><text x="330" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Time (optional)</text><rect x="330" y="198" width="270" height="34" rx="4" fill="#fff" stroke="#888"/><rect x="40" y="198" width="270" height="34" rx="4" fill="#fff" stroke="#888"/><text x="40" y="262" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Nearest city</text><rect x="40" y="270" width="560" height="34" rx="4" fill="#fff" stroke="#888"/><text x="40" y="334" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Exact location (optional)</text><rect x="40" y="344" width="140" height="30" rx="4" fill="#f2f2f2" stroke="#888"/><text x="110.0" y="363.0" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Use my location</text><text x="196" y="364" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="start">Pick on a map</text><rect x="40" y="384" width="560" height="120" rx="4" fill="#eef0ee" stroke="#888"/><text x="320.0" y="448.0" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">small map: click to drop a pin</text><text x="40" y="530" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Species  (Not sure? Unknown species)</text><rect x="40" y="538" width="560" height="34" rx="4" fill="#fff" stroke="#888"/><text x="40" y="602" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Notes (optional)</text><rect x="40" y="610" width="560" height="70" rx="4" fill="#fff" stroke="#888"/><text x="600" y="696" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="end">0 / 500</text><text x="40" y="714" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Photo (optional): resized before upload</text><rect x="40" y="722" width="120" height="30" rx="4" fill="#f2f2f2" stroke="#888"/><text x="100.0" y="741.0" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Choose file</text><rect x="40" y="774" width="560" height="56" rx="4" fill="#fdf3dc" stroke="#a8740f"/><text x="56" y="796" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="start" font-weight="bold">Worth a second look (doesn't block sending)</text><text x="56" y="816" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="start">- Ticks are rarely active in winter. Please double-check the date.</text><rect x="40" y="850" width="140" height="40" rx="4" fill="#ddd" stroke="#888"/><text x="110.0" y="874.6666666666666" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Send report</text><text x="620" y="120" font-family="Arial, sans-serif" font-size="12" fill="#b0306a" text-anchor="start">errors: summary + next to field</text><text x="620" y="810" font-family="Arial, sans-serif" font-size="12" fill="#b0306a" text-anchor="start">warnings: amber, never block</text></svg>